name: Umbala
description: Umbala (Umbala Labs, formerly Umbala Technologies / UmbalaTv) is a Vietnamese
  consumer video and camera technology startup backed by 500 Global. It built the UmbalaTv
  short-video and livestream mobile app and later the Umbala Network blockchain platform,
  including StreamX decentralized live video streaming and the CameraX camera AI/AR engine.
  The company currently maintains a minimal site at umbala.io and publishes no public API,
  developer documentation, SDKs, or machine-readable specifications; its historical
  umbala.tv domain now redirects to unrelated third-party content.
